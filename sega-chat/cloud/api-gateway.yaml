## Конфигурация Yandex Cloud API Gateway для SEGA-CHAT.
##
## Скрипт cloud/deploy.sh автоматически подставляет ID функции и сервисного
## аккаунта, создаёт или обновляет API Gateway и выдаёт рабочий адрес вида:
## https://<id-шлюза>.apigw.yandexcloud.net/
##
## Через этот адрес корректно открываются HTML-страница, стили /styles.css,
## скрипты /app.js, логотип /logo.png и запросы /api/*.

openapi: 3.0.0
info:
  title: SEGA-CHAT
  version: 1.0.0

x-yc-apigateway:
  cors:
    origin: '*'
    methods: '*'
    allowedHeaders: '*'

paths:
  /:
    x-yc-apigateway-any-method:
      summary: Страница мессенджера
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ВАШ_ID_ФУНКЦИИ
        tag: $latest
        service_account_id: ВАШ_ID_УЧЁТНОЙ_ЗАПИСИ

  /{proxy+}:
    x-yc-apigateway-any-method:
      summary: Всё остальное — страница, оформление и запросы чата
      parameters:
        - name: proxy
          in: path
          required: false
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ВАШ_ID_ФУНКЦИИ
        tag: $latest
        service_account_id: ВАШ_ID_УЧЁТНОЙ_ЗАПИСИ
